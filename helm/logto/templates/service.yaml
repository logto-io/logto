apiVersion: v1
kind: Service
metadata:
  name: {{ include "logto.fullname" . }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
    - name: admin
      port: 3002
      targetPort: admin
  selector:
    {{- include "logto.selectorLabels" . | nindent 4 }}
