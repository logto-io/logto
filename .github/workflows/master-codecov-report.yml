name: Master Codecov Report

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  report-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@1a627b19475990eb5723cbe3f8e1e2a049d2742d # v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Install playwright for element tests
        working-directory: ./packages/elements
        run: pnpm exec playwright install --with-deps

      - name: Build for test
        run: pnpm -r build:test

      - name: Test
        run: pnpm ci:test

      - name: Codecov Core
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          flags: core
          directory: ./packages/core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov UI
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          flags: experience
          directory: ./packages/experience
          token: ${{ secrets.CODECOV_TOKEN }}
